# 《推箱子点亮方块解谜：把箱子推到目标点，点亮所有方块》（game-9）AppHost 应用清单
# （平台构建管线步骤 1 读取；M1 仅支持顶层字符串键值）
# 壳位于仓库根：server/ 内是 Node20 + Hono 应用；游戏 Web 导出产物经 assets_dir 上传对象存储
name = "game-9"
runtime = "node20"
health = "/health"

# 底座 A：资产出 bundle（部署时平台把该目录上传对象存储，server 用 asset-store 懒加载，
# bundle 不含游戏资源，25MB 上限不再约束资产体积）
assets_dir = "games/game-9/export/web"
