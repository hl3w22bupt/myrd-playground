# 《光路谜阵》AppHost 应用清单（平台构建管线步骤 1 读取；M1 仅支持顶层字符串键值）
# 壳位于仓库根：server/ 内是 Node20 + Hono 应用；游戏 Web 导出产物走「资产出 bundle」
name = "light-path-labyrinth"
runtime = "node20"
health = "/health"

# 底座 A：资产出 bundle（部署时平台把该目录上传对象存储，server 用 asset-store 懒加载）。
# index.wasm 原始体积 ~35MB —— 只有资产出 bundle 才不受 25MB bundle 上限约束。
assets_dir = "games/game-4/export/web"
