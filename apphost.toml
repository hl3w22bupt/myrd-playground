# 《牛牛打游戏》game-8 AppHost 应用清单（平台构建管线步骤 1 读取；M1 仅支持顶层字符串键值）
# 壳位于仓库根：server/ 内是 Node20 + Hono 应用，游戏 Web 导出产物经 assets_dir 出 bundle
name = "game-8"
runtime = "node20"
health = "/health"

# 底座 A：资产出 bundle（部署时平台把该目录上传对象存储，server 用 asset-store 懒加载；
# wasm 35MB / pck 2.5MB 不占 25MB bundle 上限）
assets_dir = "games/game-8/export/web"
