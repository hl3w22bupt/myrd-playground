# 《探针：验证 oak key 有效性（取证用，不计入三样例）》AppHost 应用清单
# （平台构建管线步骤 1 读取；M1 仅支持顶层字符串键值）
# 取证探针：验证「游戏工程 → godot-smoke 门禁 → AppHost 部署」全链路健康，
# 不计入主项目三样例统计。壳位于仓库根：server/ 内是 Node20 + Hono 应用，
# 游戏 Web 导出产物经 assets_dir 走对象存储懒加载（底座 A，bundle 不含游戏资源）。
name = "oak-key"
runtime = "node20"
health = "/health"

# 底座 A：资产出 bundle（部署时平台把该目录上传对象存储，server 用 asset-store 懒加载；
# wasm 原始 35MB / gzip 8MB，b64 文本通道经 M1 网关回传）
assets_dir = "games/oak-key/export/web"
