<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="今日汇率 —— 轻量级汇率换算与趋势小工具，免登录即开即用" />
  <title>今日汇率 · 汇率换算与趋势</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%2314b8a6'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' fill='white'%3E%C2%A5%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <main class="page">
    <header class="page-head">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">¥</span>
        <div>
          <h1>今日汇率</h1>
          <p class="page-sub" id="dataFreshness">正在获取最新汇率…</p>
        </div>
      </div>
      <p id="staleBanner" class="stale-banner" role="status" hidden>⚠ 当前展示缓存数据，汇率可能滞后</p>
    </header>

    <!-- 换算卡：首要视觉焦点 -->
    <section class="card convert-card" aria-label="汇率换算">
      <div class="convert-row">
        <label class="field">
          <span class="field-label">金额</span>
          <input id="amount" class="amount-input" type="text" inputmode="decimal"
                 value="100" autocomplete="off" enterkeyhint="done" aria-label="输入金额" />
        </label>
        <button id="swapBtn" class="swap-btn" type="button" aria-label="交换源币种与目标币种" title="交换币种">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4v13m0 0-3-3m3 3 3-3"/><path d="M17 20V7m0 0-3 3m3-3 3 3"/></svg>
        </button>
      </div>
      <div class="currency-row">
        <label class="field">
          <span class="field-label">从</span>
          <select id="fromCurrency" class="currency-select" aria-label="源币种"></select>
        </label>
        <label class="field">
          <span class="field-label">到</span>
          <select id="toCurrency" class="currency-select" aria-label="目标币种"></select>
        </label>
      </div>

      <div class="result-block">
        <p class="result-label">换算结果</p>
        <p class="result-value" id="resultValue" aria-live="polite">--</p>
        <p class="result-rate" id="resultRate">--</p>
      </div>
    </section>

    <!-- 汇率明细：次级信息 -->
    <section class="card rate-table-card" aria-label="常用币种汇率明细">
      <h2 class="card-title">常用币种一览</h2>
      <p class="table-cap" id="tableCaption">--</p>
      <ul class="rate-list" id="rateList"></ul>
    </section>

    <!-- 趋势卡 -->
    <section class="card trend-card" aria-label="汇率趋势">
      <div class="trend-head">
        <h2 class="card-title">汇率趋势</h2>
        <div class="range-tabs" role="tablist" aria-label="趋势区间">
          <button class="range-tab is-active" type="button" role="tab" data-range="7" aria-selected="true">近 7 天</button>
          <button class="range-tab" type="button" role="tab" data-range="30" aria-selected="false">近 30 天</button>
        </div>
      </div>
      <div class="trend-meta">
        <span id="trendPair" class="trend-pair">--</span>
        <span id="trendChange" class="trend-change">--</span>
      </div>
      <div class="chart-wrap" id="chartWrap">
        <svg id="trendChart" viewBox="0 0 640 260" preserveAspectRatio="none" role="img" aria-label="汇率走势折线图"></svg>
        <p id="trendLoading" class="trend-loading">趋势数据加载中…</p>
      </div>
      <p class="chart-cap" id="chartCaption">--</p>
    </section>

    <footer class="page-foot">
      <p>汇率数据来自公开汇率 API（每日更新）· 断网时自动使用本地缓存 · 数据仅供参考，不作交易依据</p>
    </footer>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
