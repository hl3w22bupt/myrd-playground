<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>实况足球 · GOAL RUSH</title>
<style>
  :root {
    /* 风格卡 palette 镜像：#3498db / #2ecc71 / #f39c12 扁平明快 —— 与 src/render/textures.js PALETTE 同源 */
    --primary: #3498db;
    --grass: #2ecc71;
    --accent: #f39c12;
    --panel: rgba(255, 255, 255, 0.82);
    --line: rgba(52, 152, 219, 0.55);
    --text: #17313f;
    --font-num: "DIN Alternate", "Bahnschrift", "Arial Narrow", ui-sans-serif, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  /* 触屏兜底：禁浏览器手势（滚动/双击缩放/长按菜单）—— touchstart 立即可交互，消除 300ms 延迟（E-04） */
  html, body { width: 100%; height: 100%; overflow: hidden; background: #dff2fb;
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #ui { position: fixed; inset: 0; pointer-events: none; color: var(--text); font-family: var(--font-num); }
  .hidden { display: none !important; }

  #hud { position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between;
    align-items: center; padding: 12px 14px; font-size: 20px; letter-spacing: 1px; gap: 8px; }
  #hud .chip { background: var(--panel); border: 2px solid var(--line); border-radius: 12px;
    padding: 5px 12px; white-space: nowrap; }
  #hud .chip b { color: var(--primary); }
  #hud .chip.goals b { color: var(--accent); }
  #btn-pause { pointer-events: auto; width: 44px; height: 44px; min-width: 44px; min-height: 44px; /* 热区 ≥44px */
    background: var(--panel); border: 2px solid var(--line); border-radius: 12px; color: var(--text);
    font-size: 18px; font-family: inherit; }

  #banner { position: absolute; top: 16%; left: 50%; transform: translateX(-50%);
    background: var(--panel); border: 2px solid var(--accent); border-radius: 14px;
    padding: 8px 22px; font-size: 22px; color: var(--accent); letter-spacing: 2px; }
  #banner.flash-blue { border-color: var(--primary); color: var(--primary); }
  #banner.flash-orange { border-color: var(--accent); color: var(--accent); }

  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 12px;
    align-items: center; justify-content: center; text-align: center; background: rgba(223, 242, 251, 0.55); }
  .screen h1 { font-size: 38px; letter-spacing: 6px; color: var(--primary);
    text-shadow: 0 2px 0 rgba(255, 255, 255, 0.9); }
  .screen p { color: var(--text); font-size: 15px; }
  .screen .cta { color: var(--accent); font-size: 18px; margin-top: 8px; animation: pulse 1.6s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
  .screen .tagline { color: var(--grass); font-weight: bold; letter-spacing: 3px; }
  #ts-smoke { position: absolute; left: -9999px; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="ui">
  <div id="hud" class="hidden">
    <span class="chip goals">进球 <b id="goals">0/3</b></span>
    <span class="chip">金币 <b id="coins">0/10</b></span>
    <span class="chip">得分 <b id="score">0</b></span>
    <span class="chip">时间 <b id="time">90</b>s</span>
    <button id="btn-pause" aria-label="暂停">Ⅱ</button>
  </div>
  <div id="banner" class="hidden"></div>
  <div id="screen-title" class="screen">
    <h1>实况足球</h1>
    <p class="tagline">GOAL RUSH · 休闲收集</p>
    <p>带球推进 · 进 3 球提前获胜 · 顺路捡金币</p>
    <p>WASD / 方向键带球 · 空格射门 · P 暂停 · R 重开</p>
    <p>触屏：左半屏摇杆带球 · 右半屏点按射门</p>
    <p class="cta">按 回车 / 点按右侧 开球</p>
  </div>
  <div id="screen-paused" class="screen hidden">
    <h1>已暂停</h1>
    <p class="cta">按 空格 / 点按右侧 继续</p>
  </div>
  <div id="screen-over" class="screen hidden">
    <h1 id="over-title">终场哨响</h1>
    <p id="over-detail"></p>
    <p class="cta">按 回车 / 点按右侧 再来一局</p>
  </div>
  <div id="ts-smoke"></div>
</div>
<script><!--BUNDLE--></script>
</body>
</html>
