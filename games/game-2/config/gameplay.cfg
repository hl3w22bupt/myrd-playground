; 《星尘收集者》玩法数值配置 —— 需求验收标准 5「数值可配」的唯一来源。
; 修改本文件后无需改代码即可生效（autoload/game_config.gd 在启动时读取）。

[gameplay]

; 收集一颗星尘的得分（需求口径：默认 +1）
score_per_crystal = 1

; 撞上一次陨石扣除的护盾（需求口径：默认 -1）
damage_per_hit = 1

; 初始护盾点数（需求口径：默认 3，耗尽即结算）
initial_shield = 3

; 受击后的无敌帧时长（秒）：无敌帧内再次接触同一颗陨石不额外扣血
invincibility_seconds = 0.8

; 场上星尘晶体常驻数量（被收集后延迟补位）
max_crystals = 6

; 场上陨石常驻数量
max_asteroids = 5

; 陨石漂移速度区间（像素/秒）
asteroid_speed_min = 40.0
asteroid_speed_max = 110.0

; 玩家飞船移速（像素/秒）
player_speed = 240.0

; 星尘被收集后补位的延迟（秒）
respawn_delay_seconds = 1.5
