  <rect x="7" y="19" width="3.4" height="7" rx="1.7" fill="#fdf6ec"/>
  <rect x="12" y="19" width="3.4" height="7" rx="1.7" fill="#fdf6ec"/>
  <rect x="19" y="19" width="3.4" height="7" rx="1.7" fill="#fdf6ec"/>
  <rect x="24" y="19" width="3.4" height="7" rx="1.7" fill="#fdf6ec"/>
  <!-- 呼吸：身体 ry 7.6 → 8.2、cy 下移 0.4 -->
  <ellipse cx="17" cy="14.4" rx="12" ry="8.2" fill="#fdf6ec"/>
  <ellipse cx="11" cy="13" rx="3.6" ry="2.7" fill="#f39c12"/>
  <ellipse cx="20" cy="17" rx="2.6" ry="2" fill="#f39c12"/>
  <circle cx="26.5" cy="9.9" r="5.4" fill="#fdf6ec"/>
  <!-- 垂耳（rotate +15°，与 idle_0 的竖耳区分） -->
