<svg width="34" height="28" viewBox="0 0 34 28" xmlns="http://www.w3.org/2000/svg">
  <!-- 牛牛 idle_1：呼吸压扁 + 垂耳（待机第二帧，与 idle_0 组成呼吸循环） -->
