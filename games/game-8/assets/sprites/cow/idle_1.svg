  <path d="M24.5 4.9 Q23.5 1.9 25.8 1.6" stroke="#3498db" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M28.5 4.9 Q29.5 1.9 27.2 1.6" stroke="#3498db" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- 眨眼：眼睛压成横线 -->
  <rect x="26.5" y="8.2" width="2.1" height="0.9" rx="0.45" fill="#2c3e50"/>
  <ellipse cx="29" cy="12.4" rx="3.4" ry="2.4" fill="#f5c6c6"/>
  <circle cx="28.1" cy="12.4" r="0.55" fill="#2c3e50"/>
  <circle cx="30" cy="12.4" r="0.55" fill="#2c3e50"/>
