<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <!-- 结局画面背景（第四轮）：极光夜空 + 数据流光柱 + 星轨 -->
  <defs>
    <linearGradient id="esky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070618"/>
      <stop offset="60%" stop-color="#141034"/>
      <stop offset="100%" stop-color="#221546"/>
    </linearGradient>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7ad0c9" stop-opacity="0"/>
      <stop offset="35%" stop-color="#7ad0c9" stop-opacity="0.34"/>
      <stop offset="65%" stop-color="#b28dff" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#ff9e9e" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="eheart" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff9e9e" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ff9e9e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="360" fill="url(#esky)"/>
  <!-- 极光帘 -->
  <path d="M0 96 Q160 40 320 92 T640 76 L640 176 Q480 150 320 180 T0 188 Z" fill="url(#aurora)"/>
  <path d="M0 140 Q200 90 400 138 T640 128 L640 210 Q460 186 300 214 T0 224 Z" fill="url(#aurora)" opacity="0.7"/>
  <!-- 星点与星轨 -->
  <g fill="#d7e0ff">
    <circle cx="80" cy="52" r="1.2" opacity="0.7"/><circle cx="205" cy="30" r="1" opacity="0.55"/>
    <circle cx="420" cy="44" r="1.3" opacity="0.7"/><circle cx="560" cy="60" r="1.1" opacity="0.6"/>
    <circle cx="330" cy="20" r="1" opacity="0.5"/><circle cx="120" cy="120" r="1" opacity="0.45"/>
  </g>
  <path d="M40 70 Q120 34 210 44" stroke="#8fa8ff" stroke-opacity="0.35" stroke-width="1.2" fill="none"/>
  <!-- 中央心光 -->
  <ellipse cx="320" cy="238" rx="220" ry="110" fill="url(#eheart)"/>
  <!-- 数据流光柱（上传/永生意象） -->
  <g opacity="0.8">
    <rect x="150" y="216" width="2.2" height="144" fill="#7ad0c9" opacity="0.5"/>
    <rect x="298" y="200" width="2.6" height="160" fill="#b28dff" opacity="0.55"/>
    <rect x="472" y="222" width="2.2" height="138" fill="#ff9e9e" opacity="0.5"/>
  </g>
  <rect x="0" y="228" width="640" height="132" fill="#0a0820" opacity="0.55"/>
  <rect x="0" y="228" width="640" height="2" fill="#8fa8ff" opacity="0.4"/>
</svg>
