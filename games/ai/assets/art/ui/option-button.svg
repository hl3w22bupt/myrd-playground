      <stop offset="0%" stop-color="#2c2547" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#191630" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="optbar" x1="0" y1="0" x2="0" y2="1">
