  <rect x="1.5" y="2" width="493" height="37" rx="12" fill="none" stroke="#8a76c9" stroke-opacity="0.14" stroke-width="3"/>
  <rect x="1" y="1" width="494" height="38" rx="11" fill="url(#opt)" stroke="#8a76c9" stroke-opacity="0.9" stroke-width="1.4"/>
  <rect x="6" y="8" width="3.6" height="24" rx="1.8" fill="url(#optbar)"/>
  <rect x="16" y="3.5" width="470" height="1" rx="0.5" fill="#ffffff" opacity="0.10"/>
