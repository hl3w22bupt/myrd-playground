<svg xmlns="http://www.w3.org/2000/svg" width="320" height="110" viewBox="0 0 320 110">
  <!-- 对话框面板（第四轮 UI 升级）：圆角 16 + 半透明深底渐变 + 主题色描边 + 双层柔光 -->
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b1830" stop-opacity="0.94"/>
      <stop offset="100%" stop-color="#241d3f" stop-opacity="0.90"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff9e9e"/>
      <stop offset="45%" stop-color="#b28dff"/>
      <stop offset="100%" stop-color="#7ad0c9"/>
    </linearGradient>
  </defs>
  <!-- 外层柔光（模拟 glow，不用 filter：thorvg 兼容） -->
  <rect x="2" y="4" width="316" height="104" rx="18" fill="none" stroke="#ff9e9e" stroke-opacity="0.10" stroke-width="7"/>
  <rect x="3" y="3" width="314" height="104" rx="17" fill="none" stroke="#b28dff" stroke-opacity="0.16" stroke-width="4"/>
  <!-- 主体 -->
  <rect x="4" y="2" width="312" height="106" rx="16" fill="url(#panel)" stroke="#8a76c9" stroke-opacity="0.85" stroke-width="1.6"/>
  <!-- 顶部高光棱线 -->
  <rect x="18" y="4.5" width="284" height="1.2" rx="0.6" fill="#ffffff" opacity="0.14"/>
  <!-- 顶部主题渐变饰条 -->
  <rect x="14" y="0.8" width="292" height="2.6" rx="1.3" fill="url(#accent)" opacity="0.9"/>
  <!-- 左下角装饰点 -->
  <circle cx="16" cy="97" r="1.6" fill="#ff9e9e" opacity="0.7"/>
  <circle cx="22" cy="97" r="1.1" fill="#b28dff" opacity="0.6"/>
</svg>
