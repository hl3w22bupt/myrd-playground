<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <!-- 标题画面背景（第四轮）：2036 夜城 + 五色霓虹光晕 + 悬浮信标 + 星点 -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0a1e"/>
      <stop offset="55%" stop-color="#1b1440"/>
      <stop offset="100%" stop-color="#3a1f52"/>
    </linearGradient>
    <linearGradient id="city" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#241a4a"/>
      <stop offset="100%" stop-color="#120e2c"/>
    </linearGradient>
    <radialGradient id="moon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6d8"/>
      <stop offset="70%" stop-color="#ffe9b8"/>
      <stop offset="100%" stop-color="#ffe9b8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff9e9e" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ff9e9e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b28dff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#b28dff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowTeal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7ad0c9" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7ad0c9" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="360" fill="url(#sky)"/>
  <!-- 星点 -->
  <g fill="#cfd8ff">
    <circle cx="52" cy="42" r="1.3" opacity="0.8"/><circle cx="150" cy="24" r="1" opacity="0.6"/>
    <circle cx="248" cy="58" r="1.4" opacity="0.7"/><circle cx="372" cy="30" r="1" opacity="0.55"/>
    <circle cx="470" cy="66" r="1.2" opacity="0.75"/><circle cx="586" cy="36" r="1.4" opacity="0.8"/>
    <circle cx="96" cy="96" r="1" opacity="0.5"/><circle cx="532" cy="108" r="1" opacity="0.5"/>
    <circle cx="320" cy="18" r="1.2" opacity="0.65"/><circle cx="620" cy="140" r="1" opacity="0.45"/>
  </g>
  <!-- 月亮 -->
  <circle cx="524" cy="76" r="46" fill="url(#moon)" opacity="0.9"/>
  <circle cx="524" cy="76" r="20" fill="#fff3cf"/>
  <!-- 五色霓虹光晕（五位女友主题色系） -->
  <ellipse cx="120" cy="252" rx="150" ry="86" fill="url(#glowPink)"/>
  <ellipse cx="330" cy="270" rx="170" ry="92" fill="url(#glowPurple)"/>
  <ellipse cx="548" cy="250" rx="140" ry="84" fill="url(#glowTeal)"/>
  <!-- 远景天际线 -->
  <path d="M0 214 L46 214 L46 176 L74 176 L74 214 L120 214 L120 158 L150 158 L150 214 L196 214 L196 184 L228 184 L228 214 L268 214 L268 150 L300 150 L300 214 L344 214 L344 180 L378 180 L378 214 L424 214 L424 164 L454 164 L454 214 L498 214 L498 188 L530 188 L530 214 L576 214 L576 172 L608 172 L608 214 L640 214 L640 360 L0 360 Z" fill="url(#city)"/>
  <!-- 楼宇霓虹窗 -->
  <g fill="#7ad0c9" opacity="0.75">
    <rect x="128" y="166" width="4" height="5"/><rect x="138" y="178" width="4" height="5"/>
    <rect x="276" y="160" width="4" height="5"/><rect x="286" y="172" width="4" height="5"/>
    <rect x="432" y="172" width="4" height="5"/><rect x="442" y="184" width="4" height="5"/>
  </g>
  <g fill="#ff9e9e" opacity="0.7">
    <rect x="154" y="168" width="4" height="5"/><rect x="298" y="184" width="4" height="5"/>
    <rect x="584" y="180" width="4" height="5"/><rect x="80" y="184" width="4" height="5"/>
  </g>
  <g fill="#ffb35c" opacity="0.7">
    <rect x="204" y="192" width="4" height="5"/><rect x="352" y="190" width="4" height="5"/>
    <rect x="504" y="196" width="4" height="5"/>
  </g>
  <!-- 中景地平线光带 -->
  <rect x="0" y="212" width="640" height="3" fill="#7ad0c9" opacity="0.35"/>
  <rect x="0" y="215" width="640" height="1.4" fill="#ff9e9e" opacity="0.3"/>
  <!-- 街面反光 -->
  <rect x="0" y="216" width="640" height="144" fill="#0d0a22"/>
  <path d="M96 216 L88 360 L128 360 L124 216 Z" fill="url(#glowPink)" opacity="0.5"/>
  <path d="M318 216 L306 360 L352 360 L342 216 Z" fill="url(#glowPurple)" opacity="0.5"/>
  <path d="M540 216 L530 360 L566 360 L560 216 Z" fill="url(#glowTeal)" opacity="0.45"/>
  <!-- 悬浮信标（召回协议意象） -->
  <g opacity="0.9">
    <circle cx="568" cy="150" r="7" fill="#ff5d5d"/>
    <circle cx="568" cy="150" r="12" fill="none" stroke="#ff5d5d" stroke-opacity="0.4" stroke-width="2"/>
    <rect x="567.2" y="158" width="1.6" height="12" fill="#ff5d5d" opacity="0.5"/>
  </g>
  <!-- 暗角 -->
  <rect width="640" height="360" fill="#05040f" opacity="0.14"/>
</svg>
