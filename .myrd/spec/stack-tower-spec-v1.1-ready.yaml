    - expect: 本关判定窗口 140ms；前 3 次输入内存在 ≥1 个可命中窗口（160px/s×140ms=22.4px 距离阈值可达），达成 perfect 后宽度不减
      id: lvl-01-stack-tower/e05-perfect-window
      kind: rule
    - expect: perfect 同 tick 上抛 tower-ripple，载荷恰四字段，duration_ms∈[250,350]（默认 300），无整屏 aha 通道
      id: lvl-01-stack-tower/e06-tower-ripple
      kind: event
    - expect: 落块 +10；perfect 连击 1/2/3 次 bonus=25/30/35（step 5、cap 75）；HUD 显示与内核状态逐 tick 一致
      id: lvl-01-stack-tower/e07-score-hud
