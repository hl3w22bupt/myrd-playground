  world:
    architecture_rules:
    - 确定性内核（src/kernel/）零 DOM 零 Canvas：fixed timestep（16ms 累加器，dt 钳制 MAX_DT）+ seeded RNG（mulberry32），Node 可直接运行与无头测试
    - 表现层（src/render/）只做「内核快照 → 画布」映射；平台差异（输入/时钟/RAF/音频）全部经 platform/ 适配层注入，内核不得直接触碰 window/document/AudioContext
    - 事件单向流：内核上抛事件（含 tower-ripple），main 翻译成表现层副作用；内核不等待、不轮询表现层
    - 数值唯一来源 = src/kernel/numeric.ts，与 spec.numeric 一一对应；改数值必须先改策划案版本
    - 事件契约 tower-ripple：perfect 判定成立的同一 tick 由内核上抛，先于渲染；载荷恰为 {level_id:string, element_id:string, window_ms:number, duration_ms:number}，duration_ms 名义 300、容差 ±50（合法区间 [250,350]）；禁止携带整屏 aha/闪屏语义（T1 必改②：aha 特效降维为本事件契约）
    - 音频/输入闸门单向不可吞首触：AudioContext 解锁与首播必须在首触手势的事件处理同步链内完成；解锁等待、预解码 await、去抖等闸门不得吞掉或延后首次出声与首次落块；首次出声仍受 50ms 帧预算约束（acc-a5b 口径）；不设 iOS 豁免条款
    art_style: 冷灰蓝黄昏天空 + 暖色系塔块（陶土橙/砖红/沙黄循环）+ 白色切面高亮；全资产程序化（Canvas2D 渐变与几何 + WebAudio 合成音效），零外部资源
    logline: 黄昏的工地上没有起重机，只有你和一个不知疲倦的吊臂：混凝土块在塔顶左右摆荡，你要在它与塔身对齐的一瞬放手——切面留下的每一道错口都是塔的年轮，而完美的一击会让整座塔泛起一圈涟漪。
    reference: T1 终裁锚点（首卡 stack-tower）；范式基准 transport-ship-3d spec v3（确定性内核 + 契约测试 + 代持拍板）
detail: v1.1 登记就绪版：含 QA 三处缺陷修复（D1/D2/D3 一次性折入）。D1 numeric 追加 benchmark_device 组冻结中端基准机口径：实验室=playwright chromium + 4x CPU throttle + 390x844/360x640；真机单列注明设备型号与 UA（content.benchmark）。D2 acceptance 追加 acc-a7「冷启动首触即放置」（tests/audio/events.test.ts）+ world 实现约束「首触手势内完成 AudioContext 解锁与播放，闸门不得吞掉或延后首次出声（仍受 50ms 约束）」，不设 iOS 豁免条款。D3 content.evidence 增全局证据条款「每条冒烟留文件名+日期+命令+输出摘要」+ BGM 接缝双轨证据（听测留档 + tests/audio/bgm-loop.test.ts 调度连续性断言并行，均不可省）。v1 起冻结数值七键 diff 为空；levels/entities/assets/既有 22 条 acceptance/world 既有规则逐字保留，本版只增不改。版本链仅此一版：沿 v3 POST revisions version+1 单版落账，不产生 v1.2。挂账：tests/audio/* 两用例落盘属 D4（主人答复 D5 前冻结），落账前走契约 not-runnable 通道显式挂起；登记后 D4 落盘时需同步 src/kernel/numeric.ts 镜像 benchmark_device 组（契约 e07 数值总闸全量深比）。
