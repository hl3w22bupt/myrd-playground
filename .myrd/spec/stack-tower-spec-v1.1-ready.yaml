# =====================================================================
# stack-tower spec v1.1「登记就绪版」全文终稿（纸面定稿，待登记）
# =====================================================================
# 来源：本文件由 scripts/spec-v11-emit-yaml.py 从
#       .myrd/spec/stack-tower-spec-v1.1-payload.json 机械发射（勿手改；
#       改内容 → 改 games/stack-tower/tools/build-spec-v11-ready.mjs → 重新发射）。
# 版本口径：任务书所称 v1.1 ≡ 平台链 v3（approved, cmugok2uz000xm9ilx42t8pnl）的下一版；
#       登记动作 = POST /api/v1/game-design-specs/cmugok2uz000xm9ilx42t8pnl/revisions，
#       body = 本文件解析后的 {spec, detail}（仅此二键），version+1 单版落账，旧版自动 superseded。
# 冻结承诺：v1 起冻结数值七键 diff 为空；levels/entities/assets/既有 22 条 acceptance/world
#       既有规则逐字保留；版本链仅此一版（不产生 v1.2）。
# 前置条件：游戏 QA 纸面预审通过（登记就绪 / 打回）后方可登记；tests/audio/* 两用例落盘属
#       D4（主人答复 D5 前冻结），落账前由契约 not-runnable 通道显式挂起，不计绿不核销。
# =====================================================================
spec:
  acceptance:
  - check: node games/stack-tower/tests/contract/lvl-01-stack-tower_e01-spawn-first-block.spec.mjs
    id: ac-lvl01-e01-spawn
    statement: 首块生成（lvl-01-stack-tower/e01-spawn-first-block）：seed=20260925 启动后塔基块存在，宽度=BLOCK_BASE_WIDTH(120)，中心 x=逻辑宽中点，静止无速度。
  - check: node games/stack-tower/tests/contract/lvl-01-stack-tower_e02-swing-motion.spec.mjs
    id: ac-lvl01-e02-swing
    statement: 摆动确定性（lvl-01-stack-tower/e02-swing-motion）：L1 摆速=160px/s 线性往返行程 ±240px；同 seed fastForward 两次逐 tick 快照全等，且与解析解偏差=0。
  - check: node games/stack-tower/tests/contract/lvl-01-stack-tower_e03-drop-input.spec.mjs
    id: ac-lvl01-e03-input
    statement: 落块输入（lvl-01-stack-tower/e03-drop-input）：注入 {type:'drop'} 后同一 tick 摆动块转已落块、速度归零，且下一摆动块在同一 tick 序内生成。
  - check: node games/stack-tower/tests/contract/lvl-01-stack-tower_e04-overlap-cut.spec.mjs
    id: ac-lvl01-e04-cut
    statement: 切面切割（lvl-01-stack-tower/e04-overlap-cut）：offset=30 保留 90；|offset|≥width 整块掉落不加分；keepWidth<WIDTH_FLOOR_PX(36) → game-over。
  - check: node games/stack-tower/tests/contract/lvl-01-stack-tower_e05-perfect-window.spec.mjs
    id: ac-lvl01-e05-window
    statement: 完美判定窗口（lvl-01-stack-tower/e05-perfect-window）：perfectWindowMs(1)=140，perfect 距离阈值=22.4px；必改①——不存在「任何输入必失败」的无窗局面：模拟玩家前 3 次输入内存在 ≥1 个可命中窗口（|offset|≤22.4px 可达），perfect 成立后块宽不变。
  - check: node games/stack-tower/tests/contract/lvl-01-stack-tower_e06-tower-ripple.spec.mjs
    id: ac-lvl01-e06-ripple
    statement: tower-ripple 事件契约（lvl-01-stack-tower/e06-tower-ripple）：perfect 同 tick 上抛事件；载荷恰为 {level_id, element_id, window_ms, duration_ms} 四字段且类型正确；window_ms=140（本关实际窗口）；duration_ms∈[250,350]（默认 300）；必改②——断言不存在整屏 aha/闪屏通道（事件无 screen-flash 语义、表现层无全屏闪白调用）。
  - check: node games/stack-tower/tests/contract/lvl-01-stack-tower_e07-score-hud.spec.mjs
    id: ac-lvl01-e07-score
    statement: 计分与 HUD（lvl-01-stack-tower/e07-score-hud）：place=+10；perfect 连击 1/2/3 次 bonus=25/30/35（step 5、cap 75）；HUD 三项显示与内核状态逐 tick 一致。
  - check: node games/stack-tower/tests/contract/lvl-01-stack-tower_e08-fail-recover.spec.mjs
    id: ac-lvl01-e08-recover
    statement: 失败与重开（lvl-01-stack-tower/e08-fail-recover）：keepWidth<36 触发 game-over；重开后塔回单块、分数/连击清零、摆速与窗口回 L1 值（160px/s / 140ms），无状态残留。
  - check: node games/stack-tower/tests/contract/m21-acc-a1-sfx-pack-registry.spec.mjs
    id: acc-a1
    statement: sfx-pack-v1 资产注册表完整性：12 文件（6 事件 × m4a+ogg 成对）、命名 = `sfx-` + 事件 id、44.1kHz 单声道、时长≤400ms（restart ≤200ms）；manifest.json 与落盘逐项对号 + 音频头采样率/声道校验。（QA 修正③：不再断言网络 404，404 子句移入 acc-d2）
  - check: node games/stack-tower/tests/contract/m21-acc-a2-unlock.spec.mjs
    id: acc-a2
    statement: 移动端首次手势解锁：AudioManager 在首个 pointerdown 内完成 AudioContext resume；spy 断言解锁前 play 不出声（入队挂起），解锁后 state=running 且挂起/后续事件正常出声。真机（iOS Safari）项挂日期另行核销。
  - check: node games/stack-tower/tests/contract/m21-acc-a3-mute-persist.spec.mjs
    id: acc-a3
    statement: 静音持久：toggle 后 localStorage `st.settings.muted` 落盘；重建实例读回静音态；静音态 play 零输出节点（零 source 挂载）。
  - check: node games/stack-tower/tests/contract/m21-acc-a4a-combo-pitch.spec.mjs
    id: acc-a4a
    statement: 连击升调（QA 修正①拆分 a4a）：place 音第 n 连（n=1..5）升 n 半音（逐块 +1），playbackRate = 2^(semitones/12)；miss 后重置回 0 半音。
  - check: node games/stack-tower/tests/contract/m21-acc-a4b-combo-cap.spec.mjs
    id: acc-a4b
    statement: 连击升调封顶（QA 修正①拆分 a4b）：第 13、14 块（及任意更高连击）升调均 +12 封顶，不再随连击增加。
  - check: node games/stack-tower/tests/contract/m21-acc-a5a-critical-priority.spec.mjs
    id: acc-a5a
    statement: critical 音不挤占（QA 修正②拆分 a5a，单元级 spy）：8 voices 全满载时 miss / game-over / restart 仍出声（critical 绕过池上限，抢占最老非 critical voice）；非 critical 满载时新 place 被丢弃不超池。
  - check: node games/stack-tower/tests/contract/m21-acc-a5b-audio-frame-budget.spec.mjs
    id: acc-a5b
    statement: 有声开销预算（QA 修正②拆分 a5b）：seed=20260925、3 秒（187 tick）20 连 tap，有声局相对静音局逐 tick 帧耗对比——有声局零新增 >50ms 帧。
  - check: node games/stack-tower/tests/contract/m21-acc-a6-restart-event.spec.mjs
    id: acc-a6
    statement: tower-ripple 契约新增 restart 事件：sim.restart(source) 上抛恰 {type,source} 载荷（HUD 按钮=button，键盘 R=keyboard）；无 screen-flash 语义字段；restart 触发 sfx-restart（12 文件清单内，≤200ms）。
  - check: node games/stack-tower/tests/contract/m21-acc-m1-safe-area.spec.mjs
    id: acc-m1
    statement: 安全区：#hud padding 由 env(safe-area-inset-*) 换算；证据形式 = getComputedStyle 计算样式快照（注入模拟 inset 后 padding 逐边随动）+ 真机清单（iPhone 刘海/Android 手势条）挂日期。
  - check: node games/stack-tower/tests/contract/m21-acc-m2-touch-input.spec.mjs
    id: acc-m2
    statement: '触控归一：pointerdown 单一入口（触摸/笔/鼠标）、touch-action: manipulation、禁长按菜单/双指缩放（contextmenu/gesturestart preventDefault）；300ms 去抖语义与既有 INTENT_DEBOUNCE_MS 一致。真机（中端 Android/iOS）项挂日期。'
  - check: node games/stack-tower/tests/contract/m21-acc-m3-rotate-pause.spec.mjs
    id: acc-m3
    statement: 横屏遮罩激活即暂停：RotateOverlay 激活期间内核 tick 不推进、输入意图被忽略；恢复竖屏自动解除。真机项挂日期。
  - check: node games/stack-tower/tests/contract/m21-acc-m4-rotate-aspect.spec.mjs
    id: acc-m4
    statement: 遮罩判定基于视口宽高比（QA 修正④）：isLandscapeViewport(w,h) ⇔ w/h > 1；横屏(720×480)激活、竖屏(480×720)不激活、正方形(500×500)不激活；纯函数逐组断言。
  - check: node games/stack-tower/tests/contract/m21-acc-d1-pwa-shell.spec.mjs
    id: acc-d1
    statement: PWA 可安装壳：manifest.webmanifest（standalone + icons 192/512 purpose maskable）+ apple-touch-icon-180 link + index.html 引用 + sw.js 注册；HTTPS 托管地址待主人指认，真机安装项挂账不阻塞自动化验收。
  - check: node games/stack-tower/tests/contract/m21-acc-d2-offline-smoke.spec.mjs
    id: acc-d2
    statement: 断网冒烟全链路（SW precache 后离线）：冷启动→一局（tap 落块计分）→结算→重开→静音持久；含无音频 404 负面用例（sfx 全 404 不抛错、核心循环可玩）。（QA 修正③：承接 acc-a1 移出的 404 子句）
  - id: acc-a7
    statement: 冷启动首触即放置：冷启动（首帧渲染完成、零历史交互）后的第一次 pointerdown/tap 必须在同一首触手势内完成两件事——①作为有效 drop 意图当 tick 落块（输入/音频闸门不得吞掉或延后到第二次手势）；②完成 AudioContext 解锁并播出首个音效（place），首次出声不得被闸门吞掉或延后（仍受 50ms 约束：有声局相对静音局零新增 >50ms 帧，acc-a5b 口径）。不设 iOS 豁免条款：iOS Safari 与所有平台同口径验收（与 acc-a2 首手势解锁同手势取证，acc-a2 原文不变）。
    check: npx vitest run tests/audio/events.test.ts
  assets:
  - file: games/stack-tower/src/render/palette.ts
    generator: procedural:constant-table
    id: a01-block-palette
    kind: palette
    license: 仓库内自产，无第三方素材
    source: generated
  - file: games/stack-tower/src/render/textures.ts
    generator: procedural:canvas2d
    id: a02-block-face
    kind: image
    license: 仓库内程序化生成
    source: generated
  - file: games/stack-tower/src/render/backdrop.ts
    generator: procedural:canvas2d
    id: a03-bg-sky
    kind: image
    license: 仓库内程序化生成
    source: generated
  - file: games/stack-tower/src/audio/sfx.ts
    generator: procedural:webaudio
    id: a04-sfx-place
    kind: audio
    license: 仓库内合成
    source: generated
  - file: games/stack-tower/src/audio/sfx.ts
    generator: procedural:webaudio
    id: a05-sfx-perfect
    kind: audio
    license: 仓库内合成
    source: generated
  - file: games/stack-tower/assets/sfx/
    generator: procedural:webaudio→wav→afconvert/ffmpeg（tools/gen-audio.mjs）
    id: a06-sfx-restart
    kind: audio
    license: 仓库内合成，无第三方素材
    source: generated
  - file: games/stack-tower/assets/icons/
    generator: procedural:canvas2d（tools/pnglib.mjs）
    id: a07-pwa-icons
    kind: image
    license: 仓库内程序化生成
    source: generated
  content:
    formulas:
      keepWidth(offset,width): width − |offset|；|offset|≥width → 整块掉落；keepWidth<36 → game-over
      perfectDistance(level): swingSpeed(level) × perfectWindowMs(level) / 1000  → L1=22.4px
      perfectWindowMs(level): max(140 − (level−1)×8, 60)  → L1=140，L11 起封底 60
      score(perfect): +25 + min((combo−1)×5, 75)，combo=连续 perfect 次数，非 perfect 清零
      score(place): '+10'
      swingSpeed(level): min(160 + (level−1)×24, 420)  → L1=160，L11 起封顶 420（px/s）
      targetLayers(level): 8 + (level−1)×2  → L1=8 层过关，L12=30 层通关
    levelCount: 12
    mobile:
      input: 'pointerdown 单一入口；touch-action: manipulation；contextmenu/gesturestart preventDefault（禁长按菜单/双指缩放）'
      rotateOverlay:
        active: 视口宽高比 w/h > numeric.mobile.ROTATE_ASPECT_RATIO(=1) → 激活
        behavior: 激活即暂停内核 tick 与输入意图；恢复竖屏自动解除并续跑
        text: 请竖屏游玩
      safeArea:
        css: 'env(safe-area-inset-top/right/bottom/left) 换算 #hud padding'
        evidence: acc-m1 证据形式 = getComputedStyle 计算样式快照（注入模拟 inset 后 padding 随动）+ 真机清单（iPhone 刘海 / Android 手势条）
    pwa:
      fpsOverlay: '`?fps=1` 帧率覆盖层：逐帧耗时 + p95 + >50ms jank 计数（acc-a5b 真机核查入口）'
      hosting: PWA 可安装要求 HTTPS 托管；托管地址待主人指认（acc-d1 真机安装项挂账，不阻塞开发与自动化验收）
      icons:
      - assets/icons/icon-192-maskable.png
      - assets/icons/icon-512-maskable.png
      - assets/icons/apple-touch-icon-180.png
      manifest: manifest.webmanifest：name/short_name/start_url=./scope=./display=standalone/theme_color/background_color + icons 192/512（purpose "maskable any"）
      serviceWorker: sw.js 版本化 precache：CACHE 名含 numeric.deploy.PRECACHE_REVISION；install 全量预缓存核心资源；activate 清理旧版本缓存
    replayHooks:
    - fastForward(tick) 无头复现
    - 同 seed 同意图序列逐 tick 快照比对
    sessionScopeNote: sessionSeconds=180 为「单关会话护栏」（秒）：任一关从进入到达成 targetLayers(level) 或 game-over 的时长上限；12 关全长时长以试玩实测回填（QNC-05 复审项）。难度曲线总层数 = Σ(8+2(l−1)), l=1..12 = 228 层，单关 8~30 层在 180s 护栏内自洽。
    sessionSeconds: 180
    sfxPack:
      comboPitch: place 音连击升调：第 n 连 +n 半音（step=1），cap +12；miss 重置连击；playbackRate = 2^(semitones/12)
      degrade: 文件缺失/解码失败 → 回程序化合成（与 a04/a05 同源 voice 表）；任何失败不抛错、不刷 console.error
      events:
      - place
      - perfect
      - miss
      - game-over
      - restart
      - level-clear
      gain: sfx_bus_gain = 0.9（numeric.audio.SFX_BUS_GAIN）
      generator: tools/gen-audio.mjs（voice 表 → 16-bit PCM → WAV → afconvert/ffmpeg 编码，确定性可复现）
      id: sfx-pack-v1
      naming: 文件名 = `sfx-` + 事件 id（kebab-case），双格式 .m4a + .ogg 成对，共 12 文件
      persistence: 静音开关持久 localStorage `st.settings.muted`（刷新/重开保持）
      priority: critical = miss / game-over / restart：8 voices 满载时不得被挤占（可抢占最老非 critical voice）
      registry: assets/sfx/manifest.json（生成器产出）：{event_id → {m4a, ogg, duration_ms, sampleRateHz, channels}}；acc-a1 唯一断言点
      sampleRate: 44100Hz 单声道（numeric.audio.SAMPLE_RATE_HZ）
    towerRipple:
      consumers:
      - render-canvas2d：塔身波纹动画，时长=duration_ms
      - audio-sfx：完美叮（一次性，不随 duration 循环）
      duration_ms:
        nominal: 300
        range:
        - 250
        - 350
        tolerance: 50
      event: tower-ripple
      forbidden: 禁止升级为整屏 aha/闪屏特效；事件不得携带 screen-flash 语义字段（T1 必改②）
      payload:
        duration_ms: number（表现时长，ms）
        element_id: string
        level_id: string
        window_ms: number（本关实际判定窗口，ms）
      restart:
        event: restart
        forbidden: 不携带 screen-flash / 整屏 aha 语义字段（与主波纹同纪律）
        payload:
          source: '''button'' | ''keyboard''（HUD 按钮=button；键盘 R=keyboard）'
        trigger: HUD 重开按钮 click / 键盘 R；事件先于内核复位被表现层消费
      sfx_mapping:
        game-over: game-over → sfx-game-over（critical）
        level-clear: status→level-clear → sfx-level-clear
        miss: keepWidth 收窄但未触底（width-floor 之外的普通切损）→ sfx-miss
        perfect: tower-ripple → sfx-perfect
        place: block-placed（非 perfect）→ sfx-place
        restart: restart 事件 → sfx-restart（critical，≤200ms）
      trigger: perfect 判定成立的同一 tick，先于渲染帧消费
    benchmark:
      lab: 实验室自动化口径 = playwright chromium（numeric.benchmark_device.LAB_RUNNER）+ CPU throttle 4x（LAB_CPU_THROTTLE_X）+ 视口 390x844 / 360x640 两档（LAB_VIEWPORTS_PX）；acc-a5b 自动化判据（p95 ≤18.2ms、jank(>50ms)=0）在本口径下取证
      realDevice: 真机口径单列：每台设备注明「设备型号 + UA」后单独成行列判据；禁止以「中端机」泛称合并口径，真机数据不与实验室口径混算、不互相替代
      freeze: 本口径自 v1.1 起冻结：换浏览器内核/换节流档位/换视口/换基准设备，必须先升策划案版本（numeric.benchmark_device）再改测试
    evidence:
      smokeLog: 全局证据条款：每条冒烟留文件名+日期+命令+输出摘要（落 .myrd/blackboard/gate-logs/<轮次>-<日期>-<主题>/）；四要素缺任一 = 该条冒烟无效，不得计绿、不得作为核销证据
      bgmSeam: BGM 接缝证据双轨，均不可省：①听测留档（录音或听测记录，按全局证据条款四要素入档）；②tests/audio/bgm-loop.test.ts 调度连续性断言——循环点由调度器预排队（lookahead ≥ 0.2s），接缝处下一循环起始时间与当前循环结束时间偏差 ≤ 16ms（1 tick）、无重叠、无静音留白。任缺其一 = 该条冒烟不通过
  entities:
  - id: e-kernel-sim
    name: 确定性仿真内核
    role: fixed 16ms 步长累加器 + MAX_DT 钳制；fastForward(tick) 供无头契约测试；状态={tower[], moving, score, combo, level, status}
    script: games/stack-tower/src/kernel/sim.ts
  - id: e-kernel-rng
    name: seeded RNG
    role: mulberry32；摆块方向/摆幅噪声/色板轮转全部取自 RNG，同 seed 逐 tick 复现
    script: games/stack-tower/src/kernel/rng.ts
  - id: e-tower-stack
    name: 塔身栈
    role: 已落块有序栈（x,width,y 层高）；塔基块宽度=BLOCK_BASE_WIDTH；提供顶部参照与 keepWidth 下限校验
    script: games/stack-tower/src/kernel/tower.ts
  - id: e-block-moving
    name: 摆动块
    role: 当前待落块：线性往返摆动，速度=swingSpeed(level)，到达行程边界反向（零随机游走，保确定性）
    script: games/stack-tower/src/kernel/block.ts
  - id: e-cut-system
    name: 切面切割
    role: 落块时计算 |offset|：保留 overlap=width−|offset|，切掉部分转为掉落碎块（仅表现层动画用）；keepWidth<WIDTH_FLOOR 绝对值 → game-over
    script: games/stack-tower/src/kernel/cut.ts
  - id: e-perfect-judge
    name: 完美判定
    role: 把 perfectWindowMs(level) 换算为距离阈值 |offset|≤speed×window/1000 → perfect：宽度不减、combo+1、发射 tower-ripple
    script: games/stack-tower/src/kernel/judge.ts
  - id: e-ripple-emitter
    name: tower-ripple 事件发射器
    role: perfect 同 tick 上抛 {level_id, element_id, window_ms, duration_ms}；window_ms=本关实际判定窗口；duration_ms 默认 300 且 ∈[250,350]
    script: games/stack-tower/src/kernel/ripple.ts
  - id: e-difficulty-scheduler
    name: 难度调度
    role: 按 content.formulas 推进关卡与层目标 targetLayers(level)；速度/窗口只从公式取值，禁止散落魔法数
    script: games/stack-tower/src/kernel/difficulty.ts
  - id: e-input-intent
    name: 输入意图
    role: 点击/空格/触摸 → {type:'drop'} 单一意图；platform/ 适配层负责去抖与多点触控归一
    script: games/stack-tower/src/platform/input.ts
  - id: e-render-canvas2d
    name: Canvas2D 表现层
    role: 快照→画布：塔块/摆块/掉落碎块/涟漪（读 tower-ripple 的 duration_ms 播放 300±50ms 波纹）；零玩法逻辑
    script: games/stack-tower/src/render/renderer.ts
  - id: e-hud-dom
    name: HUD 层
    role: DOM 直写分数/连击/关卡进度/重开入口；数值取自内核状态，不自行计算
    script: games/stack-tower/src/ui/hud.ts
  - id: e-audio-sfx
    name: 合成音效
    role: WebAudio 程序化：落块闷响/完美叮/失败音；由事件驱动，不通晓玩法
    script: games/stack-tower/src/audio/sfx.ts
  - id: e-audio-manager
    name: 音频管理器
    role: iOS 首手势解锁 AudioContext（解锁前入队、解锁后补放）→ sfx 预解码 → 8 音池调度 → sfx_bus_gain 0.9；静音持久于 localStorage `st.settings.muted`；critical（miss/game-over/restart）满载不挤占；连击升调 playbackRate=2^(semitones/12) cap +12；文件缺失回程序化合成，任何失败不抛错
    script: games/stack-tower/src/audio/audio-manager.ts
  - id: e-touch-input-layer
    name: 触控输入层
    role: 'pointerdown 单一入口（触摸/笔/鼠标归一）+ touch-action: manipulation + 禁双击缩放/长按菜单（contextmenu/gesturestart preventDefault）；去抖 300ms 收口本层'
    script: games/stack-tower/src/platform/input.ts
  - id: e-sfx-pack-v1
    name: 音效包 v1
    role: 12 文件 = 6 事件（place/perfect/miss/game-over/restart/level-clear）× 双格式（.m4a+.ogg），命名 = `sfx-` + 事件 id，44.1kHz 单声道；注册表 manifest.json 为完整性断言点
    script: games/stack-tower/assets/sfx/
  - id: e-pwa-shell
    name: PWA 壳
    role: manifest.webmanifest（standalone + 192/512 maskable 图标）+ sw.js 版本化 precache（REVISION=numeric.deploy.PRECACHE_REVISION）+ apple-touch-icon-180；`?fps=1` 帧率覆盖层（p95 / jank 计数）
    script: games/stack-tower/{index.html,manifest.webmanifest,sw.js,assets/icons/}
  - id: e-rotate-overlay
    name: 横屏遮罩
    role: 视口宽高比 w/h > numeric.mobile.ROTATE_ASPECT_RATIO(=1) 即激活，激活即暂停内核 tick 与输入；纯函数 isLandscapeViewport(w,h) 判定；恢复竖屏自动解除
    script: games/stack-tower/src/ui/rotate-overlay.ts
  levels:
  - elements:
    - expect: seed=20260925 启动即见塔基块：宽度 120、中心在画布逻辑宽中点、y=塔基层、静止
      id: lvl-01-stack-tower/e01-spawn-first-block
