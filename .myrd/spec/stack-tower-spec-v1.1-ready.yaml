  meta:
    engine: TypeScript 5.x + Canvas 2D + vanilla（零框架、零外部运行时依赖）
    genre: 休闲叠塔（单点时机判定）
    lineage: T1 终裁（2026-09-25）首卡拍板 stack-tower；M2 生产就绪冲刺建版；spec 结构沿用 transport-ship-3d v3（platformSpecId cmue00o2z003tm9y3159fb6xl）八段范式
    oneLiner: 一块一块往上叠：看准摆动块的切面，在它扫过塔顶的瞬间点下去，切得越准塔越高，完美对齐会激起一圈塔身涟漪。
    platform: Web 单页（免安装客户端，Canvas2D 即开即玩）
    revision_note: v1.1（登记就绪版）：将主策划已拍板的 QA 三处缺陷修复一次性折入，含 QA 三处缺陷修复——D1 numeric 追加 benchmark_device 组，冻结中端基准机口径：实验室=playwright chromium + 4x CPU throttle + 390x844/360x640；真机单列注明设备型号与 UA（content.benchmark，禁止「中端机」泛称）；D2 acceptance 追加 acc-a7「冷启动首触即放置」（tests/audio/events.test.ts）+ world 实现约束「首触手势内完成 AudioContext 解锁与播放，闸门不得吞掉或延后首次出声（仍受 50ms 约束）」，不设 iOS 豁免条款；D3 content.evidence 增全局证据条款「每条冒烟留文件名+日期+命令+输出摘要」+ BGM 接缝双轨证据（听测留档 + tests/audio/bgm-loop.test.ts 调度连续性断言并行，均不可省）。v1 起冻结数值七键 diff 为空，v3 三组/levels/entities/assets/既有 22 条 acceptance/world 既有规则逐字保留，本版只增不改。版本链仅此一版：平台登记沿 v3 → POST revisions version+1 单版落账（任务书口径 v1.1 ≡ 平台链 v3 下一版），不产生 v1.2。挂账：tests/audio/events.test.ts 与 tests/audio/bgm-loop.test.ts 落盘属 D4（主人答复 D5 前冻结），落账前由契约 not-runnable 通道显式挂起，不计绿不核销。
    title: Stack Tower（叠塔）
