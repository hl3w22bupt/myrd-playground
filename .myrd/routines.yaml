# 游戏仓库例行检查 — 供 e2e-gate pre-hook 与项目详情页 Routines Tab 使用
# 位置：仓库根目录 .myrd/routines.yaml
# 口径（重要）：只保留本仓库（游戏工程）能自洽执行的检查。不要把平台主仓（myrd）的
# backend/frontend/E2E routine 复制进来——本仓库无 Node 后端与 Prisma，npx 会拉到全局
# 缓存的 prisma@8 RC（无 generate 命令）必然失败（2026-09-21 run cmuajxsyy 事故实证）。
# gate 标记：默认 true = 必检（随 e2e-gate 门禁运行）；gate: false = 可选（手动运行或工作流 preHook 引用）。
version: 1
routines:
- id: git-hygiene
  name: Git 卫生检查
  description: 提交前的仓库卫生检查 — 空白错误、冲突标记、未提交内容（秒级，无需依赖）
  steps:
  - name: whitespace-check
    command: git diff --check origin/main...HEAD
    target: host
    timeout: 30
  - name: conflict-marker-check
    command: '! grep -rnE ''^(<<<<<<<|>>>>>>>)'' games scripts .myrd --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=.godot
      2>/dev/null'
    target: host
    timeout: 30
  - name: committed-check
    command: test -z "$(git status --porcelain)" || (echo '存在未提交的修改，请先 git commit'; git status --short; exit 1)
    target: host
    timeout: 30
- id: godot-smoke
  name: Godot 无头冒烟
  description: 对 Godot 工程跑前置一致性检查 + 无头运行冒烟，断言退出码与 GODOT_SMOKE 标记 —— 「游戏能不能跑且玩得动」的机判门禁
  gate: false
  params:
    gamePath: games/godot-coin-rush
    smokeFrames: 240
  steps:
  - name: godot-availability
    command: bash std-skills/godot-game-dev/scripts/resolve-godot.sh >/dev/null
    target: host
    timeout: 30
  - name: preflight
    command: python3 std-skills/godot-game-dev/scripts/preflight.py {{gamePath}}
    target: host
    timeout: 120
  - name: headless-smoke
    command: GODOT_SMOKE_FRAMES={{smokeFrames}} GODOT_BIN="$(bash std-skills/godot-game-dev/scripts/resolve-godot.sh)" bash
      std-skills/godot-game-dev/scripts/smoke.sh {{gamePath}}
    target: host
    timeout: 300
  - name: input-fuzz
    command: GODOT_BIN="$(bash std-skills/godot-game-dev/scripts/resolve-godot.sh)" bash std-skills/godot-game-dev/scripts/input-fuzz.sh
      {{gamePath}}
    target: host
    timeout: 180
- id: game-contract
  name: 游戏契约测试
  description: 断言工程实现与 approved 版策划案（GameDesignSpec）一致 —— 实体/关卡落点文件存在、验收项有可执行检查、关卡元素编号稳定唯一
  gate: false
  params:
    # g2-blocks（熔炉方块）spec 固化导出件落点（run 仓提交固化 · v1.1 approved · 锚 302e6336…）；
    # 旧值 .myrd/spec/design-spec.json 在本工作区不存在（2026-10-06 例行驳回事故），已校正。
    specPath: .myrd/spec/g2-blocks/design-spec.json
    projectDir: .
  steps:
  - name: contract-check
    command: node scripts/contract-check.mjs --spec {{specPath}} --project {{projectDir}}
    target: host
    timeout: 120
- id: mobile-web-smoke
  name: 移动端模拟可玩性门禁
  description: headless Chrome 移动仿真（触摸/iPhone UA/390×844）打开部署后的 liveUrl，机判「移动端能不能玩」—— 网络全通/零 console 错误/画面渲染/触摸响应/音频解锁契约/视口/FPS
  gate: false
  # liveUrl 故意不给默认值：工作流 preHookParams 必传，缺参 = fail-closed 失败（列出可用入参），不会静默测错应用
  params:
    gamePath: games/godot-coin-rush
  steps:
  # 退出码 0/1/2，证据（report.json + 三张分阶段截图）落 {{gamePath}}/qa/mobile/；
  # 诊断入口：先读 report.json 的 checks/networkFailures/consoleErrors，再看截图
  - name: mobile-web-smoke
    command: node std-skills/godot-game-dev/scripts/mobile-web-smoke.mjs --url {{liveUrl}} --out {{gamePath}}/qa/mobile
    target: host
    timeout: 180
