# 游戏仓库例行检查 — 供 e2e-gate pre-hook 与项目详情页 Routines Tab 使用
# 位置：仓库根目录 .myrd/routines.yaml
# 口径（重要）：只保留本仓库（游戏工程）能自洽执行的检查。不要把平台主仓（myrd）的
# backend/frontend/E2E routine 复制进来——本仓库无 Node 后端与 Prisma，npx 会拉到全局
# 缓存的 prisma@8 RC（无 generate 命令）必然失败（2026-09-21 run cmuajxsyy 事故实证）。
# gate 标记：默认 true = 必检（随 e2e-gate 门禁运行）；gate: false = 可选（手动运行或工作流 preHook 引用）。
version: 1
routines:
- id: git-hygiene
  name: Git 卫生检查
  description: 提交前的仓库卫生检查 — 空白错误、冲突标记、未提交内容（秒级，无需依赖）
  steps:
  - name: whitespace-check
    command: git diff --check origin/main...HEAD
    target: host
    timeout: 30
  - name: conflict-marker-check
    command: '! grep -rnE ''^(<<<<<<<|>>>>>>>)'' games scripts .myrd --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=.godot
      2>/dev/null'
    target: host
    timeout: 30
  - name: committed-check
    command: test -z "$(git status --porcelain)" || (echo '存在未提交的修改，请先 git commit'; git status --short; exit 1)
    target: host
    timeout: 30
- id: godot-smoke
  name: Godot 无头冒烟
  description: 对 Godot 工程跑前置一致性检查 + 无头运行冒烟，断言退出码与 GODOT_SMOKE 标记 —— 「游戏能不能跑且玩得动」的机判门禁
  gate: false
  params:
    gamePath: games/game-8
    # 帧预算 320 = 工程 games/game-8/verify.sh 同值（godot-smoke-routine.md 模板红线：
    # 「smokeFrames 必须与该工程 verify.sh 的预算同值」）。game-8 冒烟套件自 v3 起含
    # 开始面板/多类型计分/Combo/磁铁/加速/暂停六个交互断言阶段，实测需 ~270 帧跑完，
    # 240 帧兜底会在协程跑完前截杀（无 PASS/FAIL 标记假失败）——v3 交接文档已论证
    # 「240 帧预算不足系冒烟更重，非缺陷」。工作流 preHookParams 若显式传 smokeFrames
    # 则以入参为准；此默认值仅供本仓 dogfood 与本工作流缺参兜底。
    smokeFrames: 320
    # 机器人试玩每局帧数（60 tick = 1 秒；模板红线「建议 ≈ 60 × spec.content.sessionSeconds」）。
    # 3600 = 60 × 60s 单局口径，与工程 games/game-8/tests/playtest.json 的 frames_per_run 同值。
    # 注意：tests/playtest.json 的 frames_per_run 当前不生效（playtest_driver.gd 的 `is int`
    # 类型检查在 JSON 解析出的 float 上恒假，见 v4 交接文档 §六）——驱动侧只能由本参数经
    # GODOT_PLAYTEST_FRAMES 显式传入。缺省 900 = 15 秒/局，属模板合法兜底但短于单局口径。
    playtestFrames: "3600"
  steps:
  - name: godot-availability
    command: bash std-skills/godot-game-dev/scripts/resolve-godot.sh >/dev/null
    target: host
    timeout: 30
  - name: preflight
    command: python3 std-skills/godot-game-dev/scripts/preflight.py {{gamePath}}
    target: host
    timeout: 120
  - name: headless-smoke
    command: GODOT_SMOKE_FRAMES={{smokeFrames}} GODOT_BIN="$(bash std-skills/godot-game-dev/scripts/resolve-godot.sh)" bash
      std-skills/godot-game-dev/scripts/smoke.sh {{gamePath}}
    target: host
    timeout: 300
  - name: input-fuzz
    command: GODOT_BIN="$(bash std-skills/godot-game-dev/scripts/resolve-godot.sh)" bash std-skills/godot-game-dev/scripts/input-fuzz.sh
      {{gamePath}}
    target: host
    timeout: 180
  # 机器人试玩 —— 照抄 godot-smoke-routine.md 模板的 playtest 步（v4 轮补齐：此前本 routine
  # 缺该步，工作流 preHook 不会跑 playtest，上轮「playtest 缺失」的结构性根因）。
  # bot 以确定种子多局游玩，机判节奏类代理指标下限（首次得分/无反馈窗口/反馈密度/局间方差）；
  # 3 局 × 3600 帧（60s 单局口径），wall time 数分钟 —— timeout 给足。
  - name: playtest
    command: GODOT_PLAYTEST_FRAMES={{playtestFrames}} GODOT_BIN="$(bash std-skills/godot-game-dev/scripts/resolve-godot.sh)" bash
      std-skills/godot-game-dev/scripts/playtest.sh {{gamePath}}
    target: host
    timeout: 600
- id: game-contract
  name: 游戏契约测试
  description: 断言工程实现与 approved 版策划案（GameDesignSpec）一致 —— 实体/关卡落点文件存在、验收项有可执行检查、关卡元素编号稳定唯一
  gate: false
  params:
    specPath: .myrd/spec/design-spec.json
    projectDir: .
  steps:
  - name: contract-check
    command: node scripts/contract-check.mjs --spec {{specPath}} --project {{projectDir}}
    target: host
    timeout: 120
- id: mobile-web-smoke
  name: 移动端模拟可玩性门禁
  description: headless Chrome 移动仿真（触摸/iPhone UA/390×844）打开部署后的 liveUrl，机判「移动端能不能玩」—— 网络全通/零 console 错误/画面渲染/触摸响应/音频解锁契约/视口/FPS
  gate: false
  # liveUrl 故意不给默认值：工作流 preHookParams 必传，缺参 = fail-closed 失败（列出可用入参），
  # 不会静默测错应用；gamePath 默认指向本游戏工程，证据落 {{gamePath}}/qa/mobile/。
  # 片段来源：std-skills/godot-game-dev/references/mobile-smoke-routine.md（参数化模板照抄，判定脚本零改动）。
  params:
    gamePath: games/game-8
  steps:
  - name: mobile-web-smoke
    command: "node std-skills/godot-game-dev/scripts/mobile-web-smoke.mjs --url {{liveUrl}} --out {{gamePath}}/qa/mobile"
    target: host
    timeout: 180
